version: 0.2

env:
  variables:
    ANDROID_API_LEVEL: "34"
    ANDROID_BUILD_TOOLS: "34.0.0"
    GRADLE_VERSION: "8.9"

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - export ANDROID_SDK_ROOT="$CODEBUILD_SRC_DIR/.android-sdk"
      - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
      - curl -fsSL -o /tmp/android-commandline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      - unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
      - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
      - yes | sdkmanager --licenses >/dev/null || true
      - sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
      - unzip -q /tmp/gradle.zip -d /opt

  pre_build:
    commands:
      - export ANDROID_SDK_ROOT="$CODEBUILD_SRC_DIR/.android-sdk"
      - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:/opt/gradle-${GRADLE_VERSION}/bin:$PATH"
      - test -n "$SUPABASE_URL"
      - test -n "$SUPABASE_PUBLISHABLE_KEY"
      - printf 'sdk.dir=%s\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$ANDROID_SDK_ROOT" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties

  build:
    commands:
      - export ANDROID_SDK_ROOT="$CODEBUILD_SRC_DIR/.android-sdk"
      - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:/opt/gradle-${GRADLE_VERSION}/bin:$PATH"
      - gradle --no-daemon :app:assembleDebug

artifacts:
  files:
    - app/build/outputs/apk/debug/app-debug.apk
  discard-paths: yes

cache:
  paths:
    - '/root/.gradle/caches/**/*'
    - '/root/.gradle/wrapper/**/*'
